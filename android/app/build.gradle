apply plugin: 'com.android.application'

// ── Version management ─────────────────────────────────────────────────
// Read versionCode/versionName from version.properties if available,
// otherwise fall back to defaults. CI can bump the file automatically.
def versionPropsFile = rootProject.file('version.properties')
def vCode = 1
def vName = "1.0.0"
if (versionPropsFile.canRead()) {
    def vProps = new Properties()
    vProps.load(new FileInputStream(versionPropsFile))
    vCode = (vProps['VERSION_CODE'] ?: '1').toInteger()
    vName = vProps['VERSION_NAME'] ?: '1.0.0'
}

android {
    namespace = "com.burgonomics.partner"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.burgonomics.partner"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode vCode
        versionName vName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Precedence: CI env vars -> android/key.properties (gitignored) -> debug fallback.
            def props = new Properties()
            def propsFile = rootProject.file("key.properties")
            if (propsFile.canRead()) {
                props.load(new FileInputStream(propsFile))
            }
            def keystorePath = System.getenv("RELEASE_STORE_FILE") ?: props.getProperty("storeFile") ?: "../release.keystore"
            def keystoreFile = file(keystorePath)
            def storePass = System.getenv("RELEASE_STORE_PASSWORD") ?: props.getProperty("storePassword")
            def keyPass = System.getenv("RELEASE_KEY_PASSWORD") ?: props.getProperty("keyPassword")
            def keyAliasName = System.getenv("RELEASE_KEY_ALIAS") ?: props.getProperty("keyAlias") ?: "burgonomics"
            if (keystoreFile.exists() && storePass && keyPass) {
                storeFile keystoreFile
                storePassword storePass
                keyAlias keyAliasName
                keyPassword keyPass
            } else {
                // Fallback to debug signature for local release verification
                initWith(signingConfigs.debug)
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Firebase BOM + Core (required for FirebaseApp.initializeApp in MainActivity)
    implementation platform('com.google.firebase:firebase-bom:33.4.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-appcheck'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
