name: iOS Build (Capacitor)
on:
  push:
    branches: ['review/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-ios:
    name: iOS simulator build
    # A07 (2026-10-14): macOS 14 images deprecated (removal 2026-11-02).
    # Moved to macos-26 + explicit discovery gate (Xcode major >= 26 AND
    # iOS SDK >= 26, fail closed) before any xcodebuild. Web/android/
    # release jobs, triggers and secrets above/below are untouched.
    # No SPM patch step here: the partner SPM graph resolves cleanly
    # (push-notifications declares from: "8.0.0" — measured, unlike customer).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Validate Xcode toolchain (Xcode >= 26, iOS SDK >= 26)
        # Discovers the best installed Xcode; fails closed below either floor.
        # Never hardpins an exact Xcode version.
        run: bash scripts/select-xcode-toolchain.sh
        env:
          MIN_XCODE_MAJOR: "26"
          MIN_IOS_SDK_MAJOR: "26"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare simulator-only compile fixture
        run: node scripts/prepare-simulator-config.mjs
        env:
          CI_SIMULATOR_ONLY: 'true'
      - run: npm run build:mobile -- --mode staging
      - run: npx cap sync ios
      - run: node scripts/configure-ios-firebase.mjs
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination "generic/platform=iOS Simulator" -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
        working-directory: .

