name: CI

on:
  push:
    # Default branch is feat/partner-device-smoke — CI must fire there too,
    # otherwise the gate never runs on the branch we actually ship from.
    branches: [main, master, "feat/**", "fix/**", "release/**"]
  pull_request:
  workflow_dispatch:

env:
  TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

jobs:
  web:
    name: Web build, typecheck, lint, unit suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
        env:
          VITE_FIREBASE_API_KEY: test-api-key
          VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: test-project
          VITE_FIREBASE_STORAGE_BUCKET: test.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          VITE_FIREBASE_APP_ID: "1:1234567890:web:test"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Prepare native production configuration
        run: node scripts/prepare-native-config.mjs android
        env:
          MOBILE_PRODUCTION_ENV: ${{ secrets.MOBILE_PRODUCTION_ENV }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      - run: npm run build:mobile
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android

  ios:
    name: iOS simulator build
    # A07 (2026-10-14): macOS 14 images deprecated (removal 2026-11-02).
    # Moved to macos-26 + explicit discovery gate (Xcode major >= 26 AND
    # iOS SDK >= 26, fail closed) before any xcodebuild. Web/android/
    # release jobs, triggers and secrets above/below are untouched.
    # No SPM patch step here: the partner SPM graph resolves cleanly
    # (push-notifications declares from: "8.0.0" — measured, unlike customer).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Validate Xcode toolchain (Xcode >= 26, iOS SDK >= 26)
        # Discovers the best installed Xcode; fails closed below either floor.
        # Never hardpins an exact Xcode version.
        run: bash scripts/select-xcode-toolchain.sh
        env:
          MIN_XCODE_MAJOR: "26"
          MIN_IOS_SDK_MAJOR: "26"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare native production configuration
        run: node scripts/prepare-native-config.mjs ios
        env:
          MOBILE_PRODUCTION_ENV: ${{ secrets.MOBILE_PRODUCTION_ENV }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      - run: npm run build:mobile
      - run: npx cap sync ios
      - run: node scripts/configure-ios-firebase.mjs
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination "generic/platform=iOS Simulator" -derivedDataPath build/DerivedData build
        working-directory: .

  release-aab:
    name: Release AAB (signed)
    # Manual only — must not burn minutes on regular pushes.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare native production configuration
        run: node scripts/prepare-native-config.mjs android
        env:
          MOBILE_PRODUCTION_ENV: ${{ secrets.MOBILE_PRODUCTION_ENV }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      - run: npm run build:mobile
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Neutralize Windows-only org.gradle.java.home
        run: sed -i '/^org.gradle.java.home=/d' android/gradle.properties
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/release.keystore
      - name: Fail closed if release secrets missing
        # android/app/build.gradle:50-52 silently falls back to DEBUG signing
        # when storePass/keyPass are falsy — an empty secret must abort here
        # instead of uploading a debug-signed AAB as a release artifact.
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          test -s android/release.keystore || { echo "::error::RELEASE_KEYSTORE_BASE64 missing or empty"; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "::error::RELEASE_STORE_PASSWORD secret is empty"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "::error::RELEASE_KEY_PASSWORD secret is empty"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "::error::RELEASE_KEY_ALIAS secret is empty"; exit 1; }
      - name: Build signed release AAB
        working-directory: android
        env:
          # android/app/build.gradle resolves this via file() relative to
          # android/app/, so "../release.keystore" == android/release.keystore.
          RELEASE_STORE_FILE: "../release.keystore"
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: partner-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios-archive:
    name: iOS Archive (signed when configured)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Validate Xcode toolchain (Xcode >= 26, iOS SDK >= 26)
        # Same discovery gate as the ios job: fail closed below either floor.
        run: bash scripts/select-xcode-toolchain.sh
        env:
          MIN_XCODE_MAJOR: "26"
          MIN_IOS_SDK_MAJOR: "26"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare native production configuration
        run: node scripts/prepare-native-config.mjs ios
        env:
          MOBILE_PRODUCTION_ENV: ${{ secrets.MOBILE_PRODUCTION_ENV }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      - run: npm run build:mobile
      - run: npx cap sync ios
      - run: node scripts/configure-ios-firebase.mjs
      - name: Show Xcode version (selected toolchain)
        run: xcodebuild -version
      - name: Archive unsigned iOS build
        id: archive
        run: python3 scripts/archive_ios.py
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: partner-unsigned-xcarchive
          path: build/App.xcarchive
          if-no-files-found: error
      - name: Upload signed IPA (never submit automatically)
        if: steps.archive.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-store-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error
